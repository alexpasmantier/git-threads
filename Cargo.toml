[workspace]
resolver = "3"
members = ["crates/git-threads-core", "crates/git-threads"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/alexpasmantier/git-threads"
keywords = ["git", "code-review", "comments", "annotations", "threads"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
git-threads-core = { path = "crates/git-threads-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_mangen = "0.2"
