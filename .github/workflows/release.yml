name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }} -p git-threads
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          out="git-threads-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$out/man"
          cp "target/${{ matrix.target }}/release/git-threads" "$out/"
          "target/${{ matrix.target }}/release/git-threads" mangen "$out/man" || true
          cp README.md LICENSE "$out/"
          tar czf "$out.tar.gz" "$out"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "git-threads-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/git-threads.exe" $out
          Copy-Item README.md,LICENSE $out
          Compress-Archive -Path $out -DestinationPath "$out.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            git-threads-*.tar.gz
            git-threads-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            git-threads-*.tar.gz
            git-threads-*.zip
          generate_release_notes: true
